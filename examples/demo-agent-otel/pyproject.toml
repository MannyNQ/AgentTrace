[project]
name = "demo-agent-otel"
version = "0.0.1"
description = "The demo agent's tools on Pydantic AI, traced only with OpenTelemetry: the OTLP and OTel-bridge fixture"
requires-python = ">=3.12"
dependencies = [
  "agenttrace[eval,otel]",
  "demo-agent",
  "pydantic-ai-slim>=2.61",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
demo-agent-otel = "demo_agent_otel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
