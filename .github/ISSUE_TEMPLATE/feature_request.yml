name: Feature request
description: Something Trayce should do that it doesn't.
labels: ["needs-triage", "enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do with your agent, and where Trayce gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behavior you want. A command, `eval.yaml` snippet, or sketch of the UI helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds you use now, or other tools you've tried.
