name: Eval gate

# Runs action.yml for real against a stack started in the job: a baseline at the merge-base, then
# the Action on this pull request twice, once passing and once with a deliberately broken agent
# that must fail the gate. Each posts its own sticky comment. The agent is scripted, so this needs
# no model key; it tests the Action, not the demo agent.
on:
  pull_request:
    paths:
      - action.yml
      - sdk/python/**
      - services/ingest/**
      - .github/eval-gate/**
      - .github/workflows/eval-gate.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    # The Action skips pull requests from forks (no secrets, read-only token), so its outcomes
    # can't be checked there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: uv sync --all-packages --frozen
      - name: Seed and publish the support dataset
        run: python3 -I .claude/skills/verify/bin/seed_support_dataset.py http://localhost:8000 tr-local-dev-key
      - name: Baseline, as a push to the base branch at the merge-base
        env:
          TRAYCE_ENDPOINT: http://localhost:8000
          TRAYCE_API_KEY: tr-local-dev-key
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.base_ref }}
        run: |
          merge_base=$(git merge-base "$HEAD_SHA" "origin/$BASE")
          GITHUB_EVENT_NAME=push GITHUB_SHA="$merge_base" GITHUB_REF_NAME="$BASE" \
            GITHUB_HEAD_REF= GITHUB_BASE_REF= \
            uv run trayce eval -c .github/eval-gate/eval.yaml --name baseline

      - name: The gate passes
        id: good
        uses: ./
        with:
          config: .github/eval-gate/eval.yaml
          api-url: http://localhost:8000
          api-key: tr-local-dev-key
          run-prefix: uv run
          install: "false"

      - name: The gate fails on a broken agent
        id: broken
        continue-on-error: true
        uses: ./
        env:
          EVAL_GATE_BROKEN: "1"
        with:
          config: .github/eval-gate/eval-broken.yaml
          api-url: http://localhost:8000
          api-key: tr-local-dev-key
          run-prefix: uv run
          install: "false"

      - name: Check both outcomes
        env:
          GOOD: ${{ steps.good.outputs.exit-code }}
          BROKEN: ${{ steps.broken.outputs.exit-code }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          echo "good=$GOOD broken=$BROKEN ($BROKEN_OUTCOME)"
          [ "$GOOD" = 0 ] && [ "$BROKEN" = 3 ] && [ "$BROKEN_OUTCOME" = failure ]

      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
