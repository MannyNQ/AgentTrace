name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json # reads packageManager; working-directory doesn't apply to uses
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit --prod
      - run: pnpm exec next typegen # LayoutProps and route types are generated, not checked in
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  stack:
    # Brings up the whole compose stack and checks every service reports healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://localhost:8000/health
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -m integration
        env:
          REDIS_URL: redis://localhost:6379/15
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
