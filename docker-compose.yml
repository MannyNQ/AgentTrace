name: trayce
# Host ports are overridable (TRAYCE_*_PORT) so a second project (-p) can run beside this one.
# Everything listens on 127.0.0.1 by default: ingest and the worker reach the stores on the compose
# network. Set TRAYCE_INGEST_BIND=0.0.0.0 to publish ingest to agents on other machines, once
# TRAYCE_API_KEY is a key of your own.

x-service-env: &service-env
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  # The key ingest registers for the default project (ADR-0017). The default matches .env.example
  # and the demo agent's, so a .env from before Phase 1 still works.
  TRAYCE_API_KEY: ${TRAYCE_API_KEY:-tr-local-dev-key}
  # ADR-0034: claims the install. Unset, ingest prints a setup token in its logs until claimed.
  TRAYCE_SETUP_TOKEN: ${TRAYCE_SETUP_TOKEN:-}
  # Where people open the web app. Unless it's localhost, ingest refuses the dev key above.
  TRAYCE_PUBLIC_URL: ${TRAYCE_PUBLIC_URL:-}
  # ADR-0041: peers whose Trayce-Client-IP header ingest believes. Unset: loopback and private.
  TRAYCE_TRUSTED_FORWARDERS: ${TRAYCE_TRUSTED_FORWARDERS:-}
  # ADR-0004: a trace whose root never ended is complete after this much quiet.
  TRACE_QUIET_PERIOD_S: ${TRACE_QUIET_PERIOD_S:-300}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${TRAYCE_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: trayce
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports: ["127.0.0.1:${TRAYCE_CLICKHOUSE_HTTP_PORT:-8123}:8123", "127.0.0.1:${TRAYCE_CLICKHOUSE_NATIVE_PORT:-9000}:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 here, and ClickHouse only listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # Capped, and refusing writes rather than evicting at the cap: evicting would drop queued span
    # batches or login-failure counts. A full queue answers span ingest with 503 (ADR-0015).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${TRAYCE_REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${TRAYCE_REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for large payloads (ADR-0009, ADR-0012).
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    # start.sh writes the S3 identity from .env's keys, so the secret isn't in a tracked file.
    entrypoint: ["/bin/sh", "/etc/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:${TRAYCE_S3_PORT:-8333}:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/start.sh:/etc/seaweedfs/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { PACKAGE: trayce-ingest }
    command: ["uvicorn", "trayce_ingest.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment: *service-env
    ports: ["${TRAYCE_INGEST_BIND:-127.0.0.1}:${TRAYCE_INGEST_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { PACKAGE: trayce-worker }
    command: ["trayce-worker"]
    restart: unless-stopped
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "trayce_worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  seaweedfs-data:
