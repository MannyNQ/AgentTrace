name: agenttrace
# Host ports are overridable (AGENTTRACE_*_PORT) so a second project (-p) can run beside this one.

x-service-env: &service-env
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  # The key ingest registers for the default project (ADR-0017). The default matches .env.example
  # and the demo agent's, so a .env from before Phase 1 still works.
  AGENTTRACE_API_KEY: ${AGENTTRACE_API_KEY:-at-local-dev-key}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${AGENTTRACE_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: agenttrace
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["${AGENTTRACE_CLICKHOUSE_HTTP_PORT:-8123}:8123", "${AGENTTRACE_CLICKHOUSE_NATIVE_PORT:-9000}:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 here, and ClickHouse only listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${AGENTTRACE_REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for large payloads (ADR-0009, ADR-0012).
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["${AGENTTRACE_S3_PORT:-8333}:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { PACKAGE: agenttrace-ingest }
    command: ["uvicorn", "agenttrace_ingest.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment: *service-env
    ports: ["${AGENTTRACE_INGEST_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { PACKAGE: agenttrace-worker }
    command: ["agenttrace-worker"]
    restart: unless-stopped
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "agenttrace_worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  seaweedfs-data:
