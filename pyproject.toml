[project]
name = "trayce-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "sdk/python",
  "services/ingest",
  "services/worker",
  "examples/demo-agent",
  "examples/demo-agent-otel",
]

[tool.uv.sources]
trayce = { workspace = true }
demo-agent = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-instrumentation-urllib>=0.51b0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "trayce",
  "trayce_ingest",
  "trayce_worker",
  "demo_agent",
  "demo_agent_otel",
]

[tool.pytest.ini_options]
testpaths = [
  "sdk/python/tests",
  "services/ingest/tests",
  "services/worker/tests",
  "examples/demo-agent/tests",
  "examples/demo-agent-otel/tests",
]
markers = ["integration: needs the docker compose stack running"]
addopts = "-m 'not integration'"

[tool.pyright]
include = [
  "sdk/python/src",
  "services/ingest/src",
  "services/worker/src",
  "examples/demo-agent/src",
  "examples/demo-agent-otel/src",
]
pythonVersion = "3.12"
