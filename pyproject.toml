[project]
name = "agenttrace-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk/python", "services/ingest", "services/worker", "examples/demo-agent"]

[tool.uv.sources]
agenttrace = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agenttrace", "agenttrace_ingest", "agenttrace_worker", "demo_agent"]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "services/ingest/tests", "services/worker/tests", "examples/demo-agent/tests"]
markers = ["integration: needs the docker compose stack running"]
addopts = "-m 'not integration'"

[tool.pyright]
include = ["sdk/python/src", "services/ingest/src", "services/worker/src", "examples/demo-agent/src"]
pythonVersion = "3.12"
