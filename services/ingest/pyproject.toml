[project]
name = "trayce-ingest"
version = "0.0.1"
description = "Trayce ingestion API"
requires-python = ">=3.12"
dependencies = [
  "trayce",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "clickhouse-connect>=0.8",
  "redis>=5.0",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "opentelemetry-proto>=1.30",
]

[project.scripts]
trayce-admin = "trayce_ingest.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
