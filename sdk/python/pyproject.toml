[project]
name = "agenttrace"
version = "0.0.1"
description = "Python SDK for AgentTrace, observability and evals for LLM agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# `agenttrace eval`: eval.yaml parsing and the JSON schema scorer.
eval = ["pyyaml>=6.0", "jsonschema>=4.20"]
# The OTel bridge: OpenTelemetry spans become spans in-process (ADR-0036).
otel = ["opentelemetry-sdk>=1.30"]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
